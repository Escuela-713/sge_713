<div class="container">
  <h1>{{ modoEdicion ? 'Editar bien' : 'Registrar bien nuevo' }}</h1>

  <p *ngIf="cargandoBien">Cargando bien...</p>

  <form class="edit-form" [formGroup]="formulario" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Nombre del bien:</label>
      <input type="text" class="form-control" formControlName="nombre" [class.campo-invalido]="invalido('nombre')" placeholder="Ingrese el nombre del bien">
      <small class="error" *ngIf="invalido('nombre')">{{ errorDe('nombre') }}</small>
    </div>

    <div class="form-group">
      <label>Código especial (opcional):</label>
      <input type="text" class="form-control" formControlName="codigo_especial" placeholder="Ej: Sill-004">
    </div>

    <div class="form-group">
      <label>Categoría:</label>
      <select class="form-control form-select" formControlName="categoria" [class.campo-invalido]="invalido('categoria')">
        <option [ngValue]="null" disabled>Seleccioná una categoría</option>
        <option *ngFor="let c of categorias" [ngValue]="c.id">{{ c.nombre }}</option>
      </select>
      <small class="error" *ngIf="invalido('categoria')">{{ errorDe('categoria') }}</small>
    </div>

    <div class="form-group">
      <label>Ubicación:</label>
      <select class="form-control form-select" formControlName="ubicacion" [class.campo-invalido]="invalido('ubicacion')">
        <option [ngValue]="null" disabled>Seleccioná una ubicación</option>
        <option *ngFor="let u of ubicaciones" [ngValue]="u.id">{{ u.nombre }}</option>
      </select>
      <small class="error" *ngIf="invalido('ubicacion')">{{ errorDe('ubicacion') }}</small>
    </div>

    <div class="form-row">
      <div class="form-group half">
        <label>Cantidad:</label>
        <input type="number" class="form-control" formControlName="cantidad" [class.campo-invalido]="invalido('cantidad')" placeholder="0">
        <small class="error" *ngIf="invalido('cantidad')">{{ errorDe('cantidad') }}</small>
      </div>
      <div class="form-group half">
        <label>Estado:</label>
        <select class="form-control form-select" formControlName="estado" [class.campo-invalido]="invalido('estado')">
          <option [ngValue]="null" disabled>Seleccioná un estado</option>
          <option *ngFor="let e of estados" [ngValue]="e">{{ e }}</option>
        </select>
        <small class="error" *ngIf="invalido('estado')">{{ errorDe('estado') }}</small>
      </div>
    </div>

    <div class="form-group">
      <label>Descripción:</label>
      <textarea class="form-control" rows="3" formControlName="descripcion" placeholder="Ingrese una descripción"></textarea>
    </div>

    <div class="mensaje" *ngIf="mensaje" [class.exito]="tipoMensaje === 'exito'" [class.error]="tipoMensaje === 'error'">
      {{ mensaje }}
    </div>

    <div class="form-actions">
      <button type="submit" class="button button-primary" [disabled]="enviando">
        {{ enviando ? 'Guardando...' : (modoEdicion ? 'Guardar cambios' : 'Registrar') }}
      </button>
      <button type="button" class="button button-secondary" (click)="onCancelar()">Cancelar</button>
    </div>
  </form>
</div>
