<div class="slide-form-container">
      <h2>Agregar apartado al carrusel</h2>
      
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="slide-form">
        <!-- Imagen -->
        <div class="mb-3">
          <label for="image">Imagen <span>*</span></label>
          <input 
            type="file" 
            id="image" 
            accept="image/*"
            class="form-control"
            (change)="onImageChange($event)" required
          >
          @if(form.get('image')?.invalid && form.get('image')?.touched) {
            <p class="error">La imagen es obligatoria</p>
          }

          @if(imagePreview) {
            <div class="image-preview">
              <img [src]="imagePreview" alt="Preview">
            </div>
          }
        </div>

        <!-- Título -->
        <div class="mb-3">
          <label for="title">Título <span>*</span></label>
          <input 
            id="title"
            type="text"
            class="form-control"
            formControlName="title"
            placeholder="Ingrese el título principal"
          >
          @if(form.get('title')?.invalid && form.get('title')?.touched) {
            <p class="error">El título es obligatorio</p>
          }
        </div>

        <!-- Subtítulo -->
        <div class="mb-3">
          <label for="subtitle">Subtítulo</label>
          <input 
            id="subtitle"
            type="text"
            class="form-control"
            formControlName="subtitle"
            placeholder="Ingrese el subtítulo"
          >
        </div>

        <!-- Botones de acción -->
        <div class="d-flex justify-contend-end gap-2 mt-3">
          <button type="submit" class="btn btn-submit" [disabled]="form.invalid || isSubmitting">
            {{ isSubmitting ? 'Guardando...' : 'Guardar' }}
          </button>
          <button type="button" class="btn btn-cancel" (click)="onCancel()">Cancelar</button>
        </div>
      </form>
    </div>
