<section>
  <form [formGroup]="formularioDeInscripcion" class="formulario">
    <label>
      DNI del alumno:
    </label>
    <div class="form-group mb-3">
      <input type="number" placeholder="Ej.: 48922152" formControlName="dni" class="form-control" />
    </div>
    <div class="btn-centrado">
      <button data-bs-toggle="modal" data-bs-target="#inscribirAlumno"
        class="btn btn-gral btn-outline-success">Inscribir alumno</button>
    </div>
  </form>
  <div class="modal fade" id="inscribirAlumno" tabindex="-1" aria-labelledby="inscribirAlumnoLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">Eliminar publicación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>El alumno con DNI {{Dni.value}} va a ser inscrito a la siguiente mesa. ¿Está seguro que quiere inscribir a
            este alumno?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-cancelar" data-bs-dismiss="modal">Cancelar inscripción</button>
          <button type="button" class="btn btn-gral" (click)="inscribirAlumno()">Inscribir alumno</button>
        </div>
      </div>
    </div>
  </div>
</section>
