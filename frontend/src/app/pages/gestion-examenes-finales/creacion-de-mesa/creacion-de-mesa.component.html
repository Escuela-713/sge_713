<form [formGroup]="formularioMesaExamen">
  <h2>Mesa de Examen</h2>
  <label>
    Año:
    <select formControlName="ano" required>
      @for (curso of cursos; track curso) {
        <option [value]="curso">{{ curso }}°</option>
      }
    </select>
  </label>
  <label>
    Carrera:
    <select formControlName="carrera" required>
      @for (carrera of carreras; track carrera.id_carrera) {
        <option [value]="carrera.nombre">{{ carrera.nombre }}</option>
      }
    </select>
  </label>

  <label>
    Materia:
    <select formControlName="materia" required>
      @for (materia of materias; track materia.id_materia) {
        <option [value]="materia.nombre">{{ materia.nombre }}</option>
      }
    </select>
  </label>
  <label>
    Profesor titular:
    <input type="text" formControlName="profesorTitular" required />
  </label>
  <label>
    Profesor primer vocal:
    <input
      type="text"
      formControlName="profesorPrimerVocal"
      required
    />
  </label>
  <label>
    Profesor segundo vocal:
    <input
      type="text"
      formControlName="profesorSegundoVocal"
      required
    />
  </label>

  <label>
    Fecha del examen:

    <input type="date" formControlName="fecha" required />
  </label>

  <label>
    Turno:
    <select formControlName="turno" required>
      <option value="">Seleccionar...</option>
      <option value="mañana">Mañana</option>
      <option value="tarde">Tarde</option>
      <option value="noche">Noche</option>
    </select>
  </label>
  <button type="submit">Enviar inscripcion</button>
</form>
