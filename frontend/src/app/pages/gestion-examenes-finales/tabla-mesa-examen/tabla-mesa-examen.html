<section>
  <form action="">
    <label for="materia">Materia:</label>
    <select name="materia" id="materia" required>
      @for(materia of materias; track materia.id_materia) {
      <option [value]="materia.nombre">{{materia.nombre}}</option>
      }
    </select>
    <label for="carrera">Carrera:</label>
    <select name="carrera" id="carrera" required>
      @for(carrera of carreras; track carrera.id_carrera) {
      <option [value]="carrera.nombre">{{carrera.nombre}}</option>
      }
    </select>
    <label for="ano">Año:</label>
    <select name="ano" id="ano" required>
      @for(curso of cursos; track curso) {
      <option [value]="curso">{{curso}}°</option>
      }
    </select>
    <input type="submit" value="Buscar mesa" />
  </form>
  <table>
    <caption>
      Planilla de Evaluación
    </caption>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Curso</th>
        <th>Materia</th>
        <th>Turno</th>
        <th>Tribunal</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td>
          <button id="inscribirse-a-la-mesa">Inscribirse</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
